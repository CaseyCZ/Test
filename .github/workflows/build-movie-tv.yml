name: Movie TV OCR debug
on:
  push:
    branches: [feature/tv-movie-translation]
    paths: ['movie-tv/**', '.github/workflows/build-movie-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle -p movie-tv :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Movie-TV-OCR-debug
          path: movie-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
