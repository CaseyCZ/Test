name: Build TCL C835 GPU diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [Master, diagnostics/tcl835-hdmi-trace]
    paths:
      - ".github/workflows/build-tcl835-test.yml"
      - "tools/patch_tcl835.py"
      - "tools/TclDiagnostika.kt"
      - "tools/TclOnlineNastaveni.kt"
      - "tools/TclOdesilacLogu.kt"
      - "collector/**"
  pull_request:
    branches: [Master]
    paths:
      - ".github/workflows/build-tcl835-test.yml"
      - "tools/patch_tcl835.py"
      - "tools/TclDiagnostika.kt"
      - "tools/TclOnlineNastaveni.kt"
      - "tools/TclOdesilacLogu.kt"
      - "collector/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic build kit
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Checkout pinned upstream PlayCaption 0.22
        uses: actions/checkout@v4
        with:
          repository: AdamRuzick4/PlayCaption-app
          ref: 633a847400b6c4bac1e7f034463e7847a53a9590
          path: upstream
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android SDK platform and tools
        shell: bash
        run: |
          set -euo pipefail
          # GitHub ubuntu-latest already provides the command-line SDK manager.
          # setup-android@v3 fails in 2026 while requesting the removed 'tools' package.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Validate private collector and authentication
        run: |
          node --check kit/collector/server.cjs
          node --test kit/collector/test-server.cjs

      - name: Apply TCL diagnostic patch
        run: |
          python -m py_compile kit/tools/patch_tcl835.py
          python kit/tools/patch_tcl835.py upstream
          test -s upstream/app/src/main/java/cz/titulky/tv/TclDiagnostika.kt
          test -s upstream/app/src/main/java/cz/titulky/tv/TclOnlineNastaveni.kt
          test -s upstream/app/src/main/java/cz/titulky/tv/TclOdesilacLogu.kt
          grep -q "TCL C835 HDMI TRACE" upstream/app/src/main/java/cz/titulky/tv/Zaznam.kt

      - name: Select Gradle compatible with Android Gradle Plugin 8.5.2
        run: |
          sed -i 's@gradle-9\.6\.0-bin\.zip@gradle-8.7-bin.zip@' upstream/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.7-bin.zip' upstream/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify separate application ID
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='cz.titulky.tv.tcl835gpudiag'"

      - name: Upload test APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: TCL-C835-Caption-GPU-TEST
          path: |
            upstream/app/build/outputs/apk/debug/*.apk
            kit/tools/patch_tcl835.py
            kit/tools/TclDiagnostika.kt
            kit/tools/TclOnlineNastaveni.kt
            kit/tools/TclOdesilacLogu.kt
            kit/collector/server.cjs
            kit/README.md
          if-no-files-found: error
          retention-days: 14
