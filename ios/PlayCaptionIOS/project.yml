name: PlayCaptionIOS
options:
  bundleIdPrefix: cz.caseycz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
targets:
  PlayCaptionIOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WebRTC
        product: WebRTC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PlayCaption iOS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "Najde PlayCaption televizi v domácí síti a posílá do ní české titulky."
        UIRequiresPersistentWiFi: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.caseycz.playcaption.ios
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
schemes:
  PlayCaptionIOS:
    build:
      targets:
        PlayCaptionIOS: all
    run:
      config: Debug
    archive:
      config: Release
